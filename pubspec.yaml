name: omni_app
description: "Omni TouristOS - AI Travel & Intelligence Hub"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 8.3.7
  audioplayers: ^6.0.0
  geolocator: ^11.1.0
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.3+1
  http: ^1.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png