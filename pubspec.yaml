name: omni_app
description: "Omni TouristOS - AI Travel & Forensic Civic Operating System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Web & Deep Linking
  webview_flutter: ^4.7.0
  url_launcher: ^6.3.2

  # Files, Gallery & Storage
  file_picker: ^8.3.7
  image_picker: ^1.2.3
  gal: ^2.3.0
  image: ^4.2.0
  path_provider: ^2.1.2
  share_plus: ^10.1.4

  # Documents & PDF Generation
  pdf: ^3.10.8
  printing: ^5.13.2
  flutter_markdown: ^0.7.3+1

  web_socket_channel: ^3.0.3
  http: ^1.2.0
  flutter_bloc: ^8.1.3

  # Location, Sensors & Motion Radar
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # Audio, Speech & Walkie-Talkie Interpreter
  audioplayers: ^6.0.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Networking, Backend & State
  http_parser: ^4.0.2
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3

  # Security & Biometrics
  local_auth: ^2.2.0

  # Offline AI Tools
  google_mlkit_translation: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0F172A"
  image: assets/logo.png
  fullscreen: true
  android: true
  ios: true
  android_12:
    color: "#0F172A"
    image: assets/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/dashboard_fort.png